name: fluxopay-staging

services:
  web:
    container_name: fluxopay-web
    image: fluxopay-web:${FLUXOPAY_IMAGE_TAG:-staging}
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?required}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?required}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?required}
    env_file:
      - ${FLUXOPAY_WEB_ENV_FILE:?required}
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${FLUXOPAY_BIND_IP:-127.0.0.1}:${FLUXOPAY_WEB_PORT:-3110}:3000"
    networks:
      - fluxopay-internal
      - fluxopay-edge
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.next/cache:rw,noexec,nosuid,size=64m,uid=1001,gid=1001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  fluxopay-internal:
    external: true
    name: fluxopay-internal
  fluxopay-edge:
    external: true
    name: fluxopay-edge
